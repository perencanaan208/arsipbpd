<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04364f">
<title>E-Arsip BPD Desa Baleharjo</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="application-name" content="E-Arsip BPD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="E-Arsip BPD">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#04364f;overflow:hidden;font-family:'Segoe UI',Roboto,Arial,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eaf5f9}
  #ld{position:fixed;inset:0;display:grid;place-items:center;color:#fff;text-align:center;z-index:1;transition:opacity .3s}
  #ld.off{opacity:0;pointer-events:none}
  .sp{width:42px;height:42px;border:4px solid #ffffff44;border-top-color:#18b4d4;border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  #ld a{color:#7fe0f5;font-size:13px}
</style>
</head>
<body>
  <div id="ld"><div><div class="sp"></div>Memuat aplikasi…<br><br><a id="direct" target="_blank" rel="noopener">Tidak muncul? Buka langsung</a></div></div>
  <iframe id="app" title="Arsip & Data BPD Desa Baleharjo" allow="clipboard-write; fullscreen"></iframe>
<script>
  // ⬇️ GANTI dengan URL Web App dari Apps Script (Deploy → Manage deployments), berakhiran /exec
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwOVAgc7AYCqSNnu-2ym-TLplMA_hrWH2nQZaG4KRT3AZAaa3W3u9kpRNf5emeaWK82Fg/exec";

  const f = document.getElementById('app');
  f.src = GAS_URL;
  document.getElementById('direct').href = GAS_URL;
  f.addEventListener('load', () => document.getElementById('ld').classList.add('off'));
  setTimeout(() => document.getElementById('ld').classList.add('off'), 8000);
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
